name: Build Dash Drift APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'DashDrift_Windows_Starter/DashDrift_Starter/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: DashDrift_Windows_Starter/DashDrift_Starter
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DashDrift-debug-apk
          path: DashDrift_Windows_Starter/DashDrift_Starter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
